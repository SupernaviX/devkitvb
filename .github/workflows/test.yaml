name: Release

on:
  push:
    branches-ignore: []

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Clear Disk Space
        run: ./scripts/clear-disk-space-linux.sh
        shell: bash
      - name: Build Bundles
        run: ./scripts/bundle.sh
        shell: bash
